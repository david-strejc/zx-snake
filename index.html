<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNAKE 3D · ZX SPECTRUM EDITION</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000}
canvas{display:block;position:fixed;inset:0}
#border{position:fixed;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 0 10px #d8d800,inset 0 0 80px rgba(0,0,0,.9);transition:box-shadow .08s}
#scan{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.45;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}
#vign{position:fixed;inset:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6) 100%)}
#hud{position:fixed;top:0;left:0;right:0;z-index:8;display:flex;justify-content:space-between;align-items:flex-start;padding:26px 30px;font-family:'Press Start 2P',monospace;font-size:13px;color:#d8d8d8;text-shadow:0 0 8px currentColor;pointer-events:none}
#hud .dim{opacity:.55;font-size:10px}
.pop{position:fixed;z-index:7;transform:translate(-50%,-50%);font-family:'Press Start 2P',monospace;font-size:14px;color:#d8d8d8;text-shadow:0 0 8px #00d8d8;pointer-events:none;animation:popUp .7s forwards}
@keyframes popUp{to{transform:translate(-50%,-180%);opacity:0}}
#ov{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;background:rgba(0,0,4,.58);font-family:'Press Start 2P',monospace;text-align:center}
#ov.hidden{display:none}
.ltr{display:inline-block;animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.4}}
#big{font-size:clamp(26px,6.5vw,58px);letter-spacing:.05em;line-height:1.4}
#mid{font-size:clamp(11px,2vw,16px);color:#00d8d8;line-height:1.8}
#hint{font-size:clamp(10px,1.8vw,14px);color:#d8d8d8;animation:blink2 1.1s steps(2,start) infinite}
@keyframes blink2{50%{opacity:0}}
#footlines{font-size:9px;line-height:2.2;color:#00d8d8;opacity:.8}
#foot{position:fixed;bottom:16px;left:0;right:0;text-align:center;z-index:8;font-family:'Press Start 2P',monospace;font-size:8px;color:#00d8d8;opacity:.65;pointer-events:none}
</style>
</head>
<body>
<div id="border"></div>
<div id="scan"></div>
<div id="vign"></div>
<div id="hud">
  <div id="sc">SCORE 00000</div>
  <div class="dim" id="snd">SOUND ON · M</div>
  <div id="hi">HI 00000</div>
</div>
<div id="ov">
  <div id="big"></div>
  <div id="mid"></div>
  <div id="hint"></div>
  <div id="footlines"></div>
</div>
<div id="foot">ZX SPECTRUM BEEPER · 1982 · 48K</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const ZX={black:0x000000,blue:0x0000d8,red:0xd80000,magenta:0xd800d8,green:0x00d800,cyan:0x00d8d8,yellow:0xd8d800,white:0xd8d8d8};
const PALETTE=[ZX.green,ZX.cyan,ZX.blue,ZX.magenta,ZX.red,ZX.yellow];
const N=18,C=(N-1)/2,Y=.46;
const hx=n=>'#'+n.toString(16).padStart(6,'0');
const pad5=n=>String(n).padStart(5,'0');
const $=id=>document.getElementById(id);

let hi=+(localStorage.getItem('zxsnake_hi')||0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x000000);
scene.fog=new THREE.Fog(0x000000,16,46);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,120);
camera.position.set(0,11,17);

scene.add(new THREE.AmbientLight(0x808098,1.5));
const headLight=new THREE.PointLight(0xfff2b0,45,11,2);
const foodLight=new THREE.PointLight(ZX.red,30,8,2);
scene.add(headLight,foodLight);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x06060c,roughness:1,metalness:0}));
floor.rotation.x=-Math.PI/2;
floor.position.y=-.02;
scene.add(floor);

const grid=new THREE.GridHelper(N,N,ZX.cyan,0x004050);
grid.material.opacity=.32;
grid.material.transparent=true;
grid.position.y=.01;
scene.add(grid);

const cageMat=new THREE.LineBasicMaterial({color:ZX.yellow});
const cage=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(N,5,N)),cageMat);
cage.position.y=2.5;
scene.add(cage);

const boxGeo=new THREE.BoxGeometry(.92,.92,.92);
const eyeGeo=new THREE.BoxGeometry(.15,.15,.06);
const headGrp=new THREE.Group();
const headMesh=new THREE.Mesh(boxGeo,new THREE.MeshStandardMaterial({color:ZX.yellow,metalness:.35,roughness:.3}));
const eyeMat=new THREE.MeshBasicMaterial({color:ZX.white});
const pupMat=new THREE.MeshBasicMaterial({color:ZX.black});
const eyeGeo2=new THREE.BoxGeometry(.07,.07,.03);
for(const s of[-1,1]){
  const eye=new THREE.Mesh(eyeGeo,eyeMat);eye.position.set(.2*s,.18,.44);
  const pup=new THREE.Mesh(eyeGeo2,pupMat);pup.position.set(.2*s,.18,.47);
  headGrp.add(eye,pup);
}
headGrp.add(headMesh);
headGrp.position.y=Y;
scene.add(headGrp);

const foodMesh=new THREE.Mesh(new THREE.IcosahedronGeometry(.5,0),new THREE.MeshStandardMaterial({color:ZX.magenta,emissive:ZX.red,emissiveIntensity:.9,metalness:.4,roughness:.3}));
scene.add(foodMesh);

const pGeo=new THREE.BoxGeometry(.14,.14,.14);
const parts=[];

const W=(c,y=Y)=>new THREE.Vector3(c.x-C,y,c.z-C);

function setBorder(hex){
  const c=hx(hex);
  $('border').style.boxShadow=`inset 0 0 0 10px ${c},inset 0 0 90px ${c}55,0 0 50px ${c}66`;
  cageMat.color.set(hex);
}
function flashSeq(step,seq,total){
  let i=0;
  const id=setInterval(()=>{
    setBorder(seq[i%seq.length]);i++;
    if(i>=total){clearInterval(id);setBorder(ZX.yellow);}
  },step);
}

let ctx=null,master,muted=false;
function ac(){
  if(!ctx){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain();master.gain.value=muted?0:.22;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4200;
    master.connect(lp).connect(ctx.destination);
  }
  if(ctx.state==='suspended')ctx.resume();
  return ctx;
}
function beep(freq,t0=0,dur=.08,vol=1,slideTo=0){
  const c=ac(),t=c.currentTime+t0;
  const o=c.createOscillator(),g=c.createGain();
  o.type='square';
  o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(Math.max(.001,vol),t);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(master);
  o.start(t);o.stop(t+dur+.03);
}
function noise(t0=0,dur=.5,vol=.35){
  const c=ac(),t=c.currentTime+t0,len=(c.sampleRate*dur)|0;
  const buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=c.createBufferSource();s.buffer=buf;
  const g=c.createGain();g.gain.value=vol;
  s.connect(g).connect(master);
  s.start(t);
}
const sfxEat=()=>{beep(523,0,.05,.7);beep(1046,.05,.05,.7);beep(1568,.10,.06,.7);};
const sfxDie=()=>{beep(400,0,.55,.6,55);noise(0,.5,.4);};
const sfxJingle=()=>{[660,880,1320,1760].forEach((f,i)=>beep(f,i*.08,i===3?.22:.07,.6));};
const sfxStart=()=>{beep(330,0,.1,.5);beep(660,.11,.1,.5);beep(990,.22,.12,.5);beep(1320,.35,.28,.6);};
const sfxBlip=()=>beep(220,0,.04,.25);

let state='title',paused=false;
let snake,food,dir,pending=[],score=0,eats=0,tickMs=125,hue=0,t=0;
const angD=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));
let headFrom=new THREE.Vector3(),headTo=new THREE.Vector3(),hAngFrom=0,hAngTo=0,hDelta=0;

let segs=[];
function newFood(){
  for(let i=0;i<500;i++){
    const f={x:(Math.random()*N)|0,z:(Math.random()*N)|0};
    if(!snake.some(s=>s.x===f.x&&s.z===f.z)){food=f;return;}
  }
  food={x:0,z:0};
}
function freshGame(){
  snake=[{x:9,z:9},{x:8,z:9},{x:7,z:9},{x:6,z:9}];
  dir={x:1,z:0};
  pending=[];score=0;eats=0;tickMs=125;
  newFood();hud();
  headFrom.copy(W(snake[0]));headTo.copy(headFrom);
  headGrp.position.copy(headTo);
  hAngFrom=hAngTo=Math.atan2(dir.x,dir.z);hDelta=0;
  headGrp.rotation.y=hAngFrom;
  for(let i=0;i<segs.length;i++){
    const c=snake[i+1];if(!c)break;
    const w=W(c);
    segs[i].userData.from.copy(w);
    segs[i].userData.to.copy(w);
    segs[i].position.copy(w);
  }
}

function hud(){
  $('sc').textContent='SCORE '+pad5(score);
  $('hi').textContent='HI '+pad5(Math.max(hi,score));
}
function popText(txt,c){
  if(state!=='playing')return;
  const v=W(c,1.2).clone().project(camera);
  const el=document.createElement('div');
  el.className='pop';el.textContent=txt;
  el.style.left=((v.x+1)/2*innerWidth)+'px';
  el.style.top=((1-v.y)/2*innerHeight)+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),700);
}
function burst(c){
  const p=W(c,.9);
  for(let i=0;i<18;i++){
    const m=new THREE.Mesh(pGeo,new THREE.MeshBasicMaterial({color:PALETTE[(Math.random()*6)|0]}));
    m.position.copy(p);
    parts.push({m,v:new THREE.Vector3((Math.random()-.5)*7,Math.random()*6+3,(Math.random()-.5)*7),life:.8});
    scene.add(m);
  }
}

function eat(){
  score+=10;eats++;
  tickMs=Math.max(55,125-eats*6);
  sfxEat();burst(food);popText('+10',food);
  flashSeq(60,[ZX.cyan,ZX.green],4);
  if(score>hi){hi=score;localStorage.setItem('zxsnake_hi',String(hi));}
  if(score%100===0){sfxJingle();popText('100!',snake[0]);}
  newFood();hud();
}

function demoPick(){
  const opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dz])=>{
    if(dx===-dir.x&&dz===-dir.z)return false;
    const tx=(snake[0].x+dx+N)%N,tz=(snake[0].z+dz+N)%N;
    for(let i=1;i<snake.length;i++)if(snake[i].x===tx&&snake[i].z===tz)return false;
    return true;
  });
  if(!opts.length)return dir;
  const o=opts[(Math.random()*opts.length)|0];
  return{x:o[0],z:o[1]};
}

function step(){
  if(state==='playing'){
    if(pending.length)dir=pending.shift();
  }else{
    dir=demoPick();
  }
  let nx=snake[0].x+dir.x,nz=snake[0].z+dir.z;
  if(state!=='playing'){
    nx=(nx+N)%N;nz=(nz+N)%N;
  }else{
    if(nx<0||nx>=N||nz<0||nz>=N)return die();
    const grow=nx===food.x&&nz===food.z;
    const lim=grow?snake.length:snake.length-1;
    for(let i=0;i<lim;i++)if(snake[i].x===nx&&snake[i].z===nz)return die();
  }
  snake.unshift({x:nx,z:nz});
  if(nx===food.x&&nz===food.z){
    if(state==='playing')eat();
  }else{
    snake.pop();
    if(state!=='playing'&&snake.length>8){
      let hit=false;
      for(let i=1;i<snake.length-1;i++)if(snake[i].x===snake[0].x&&snake[i].z===snake[0].z)hit=true;
      if(hit){freshGame();return;}
    }
  }
  hue=(hue+1)%6;
  headFrom.copy(headTo);
  headTo.copy(W(snake[0]));
  hAngFrom=hAngTo;
  hAngTo=Math.atan2(dir.x,dir.z);
  hDelta=angD(hAngTo,hAngFrom);
  for(let i=0;i<segs.length;i++){
    const c=snake[i+1];if(!c)break;
    segs[i].userData.from.copy(segs[i].userData.to);
    segs[i].userData.to.copy(W(c));
  }
}

function die(){
  state='dying';
  sfxDie();
  shake=1;
  flashSeq(70,[ZX.red,ZX.white],14);
  setTimeout(()=>{
    state='over';
    const win=score>hi&&score>0;
    if(score>hi)hi=score;
    $('big').innerHTML=`<span style="color:${hx(ZX.red)};text-shadow:0 0 14px ${hx(ZX.red)}">GAME OVER</span>`;
    $('mid').textContent='SCORE '+pad5(score)+(win?' · NEW HI-SCORE!':'');
    $('hint').textContent='PRESS ENTER TO PLAY AGAIN';
    $('footlines').innerHTML='ARROWS / WASD — MOVE<br>P — PAUSE · M — SOUND<br>HI-SCORE '+pad5(hi);
    $('ov').classList.remove('hidden');
    freshGame();
  },1000);
}

let shake=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-(frame.last||now))/1000);
  frame.last=now;
  t=now/1000;

  if(!paused&&state!=='dying'){
    if(state==='playing'||state==='title'||state==='over'){
      frame.acc=Math.min(.5,(frame.acc||0)+dt);
      while(frame.acc>=tickMs/1000){frame.acc-=tickMs/1000;step();}
    }else frame.acc=0;
  }

  const e=1-Math.exp(-dt*18);
  while(segs.length<snake.length-1){
    const m=new THREE.Mesh(boxGeo,new THREE.MeshStandardMaterial({color:PALETTE[0],metalness:.3,roughness:.35}));
    const p=W(snake[snake.length-1]);
    m.userData={from:p,to:p.clone()};
    m.position.copy(p);
    m.scale.setScalar(.5);
    scene.add(m);segs.push(m);
  }
  while(segs.length>snake.length-1){
    const m=segs.pop();
    scene.remove(m);m.material.dispose();
  }
  const prog=Math.min(1,Math.max(0,(frame.acc||0)/(tickMs/1000)));
  headGrp.position.lerpVectors(headFrom,headTo,prog);
  headGrp.rotation.y=hAngFrom+hDelta*prog;
  headLight.position.copy(headGrp.position).add(new THREE.Vector3(0,1.8,0));

  for(let i=0;i<segs.length;i++){
    const s=segs[i],c=snake[i+1];
    if(!c)break;
    s.position.lerpVectors(s.userData.from,s.userData.to,prog);
    s.scale.setScalar(Math.max(.5,1-i*.04));
    s.material.color.set(i===0?ZX.white:PALETTE[(c.x+c.z+hue)%6]);
  }

  if(food){
    const fp=W(food,.9+Math.sin(t*3)*.15);
    foodMesh.position.copy(fp);
    foodMesh.rotation.y+=dt*2.2;
    foodMesh.rotation.x+=dt;
    foodLight.position.copy(foodMesh.position);
    foodLight.intensity=26+Math.sin(t*6)*13;
  }

  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.life-=dt;
    if(p.life<=0){scene.remove(p.m);p.m.material.dispose();parts.splice(i,1);continue;}
    p.v.y-=14*dt;
    p.m.position.addScaledVector(p.v,dt);
    p.m.scale.setScalar(Math.max(.01,p.life/.8));
    p.m.rotation.x+=dt*5;p.m.rotation.y+=dt*7;
  }

  shake=Math.max(0,shake-dt*1.6);
  const hxj=(Math.random()-.5)*shake*1.4,hzj=(Math.random()-.5)*shake*1.4;
  if(state==='playing'||state==='dying'){
    const hp=headGrp.position;
    camera.position.set(hp.x,hp.y+11.5,hp.z+10.5);
    camera.position.x+=hxj;camera.position.y+=hzj;
    camera.lookAt(hp.x,hp.y+.5,hp.z);
  }else{
    const a=t*.25;
    camera.position.lerp(new THREE.Vector3(Math.sin(a)*17,9.5,Math.cos(a)*17),e*.6);
    camera.position.x+=hxj;camera.position.y+=hzj;
    camera.lookAt(0,.6,0);
  }

  renderer.render(scene,camera);
}

const KEYS={ArrowUp:{x:0,z:-1},KeyW:{x:0,z:-1},ArrowDown:{x:0,z:1},KeyS:{x:0,z:1},ArrowLeft:{x:-1,z:0},KeyA:{x:-1,z:0},ArrowRight:{x:1,z:0},KeyD:{x:1,z:0}};
function queueDir(v){
  const last=pending.length?pending[pending.length-1]:dir;
  if(last.x===-v.x&&last.z===-v.z)return;
  if(pending.length<3)pending.push(v);
}
function rainbowText(s){
  return [...s].map((ch,i)=>ch===' '
    ?' '
    :`<span class="ltr" style="color:${hx(PALETTE[i%6])};animation-delay:${i*90}ms">${ch}</span>`).join('');
}
function showTitle(){
  $('big').innerHTML=rainbowText('SNAKE 3D');
  $('mid').textContent='ZX SPECTRUM EDITION · 1982';
  $('hint').textContent='PRESS ENTER TO PLAY';
  $('footlines').innerHTML='ARROWS / WASD — MOVE<br>P — PAUSE · M — SOUND<br>HI-SCORE '+pad5(hi);
  $('ov').classList.remove('hidden');
}
function startGame(){
  freshGame();
  state='playing';paused=false;
  const hp=W(snake[0]);
  camera.position.set(hp.x,hp.y+11.5,hp.z+10.5);
  camera.lookAt(hp.x,hp.y+.5,hp.z);
  $('ov').classList.add('hidden');
  sfxStart();
}
function togglePause(){
  paused=!paused;
  if(paused){
    state='playing';
    $('big').innerHTML=`<span style="color:${hx(ZX.cyan)};text-shadow:0 0 12px ${hx(ZX.cyan)}">PAUSED</span>`;
    $('mid').textContent='';
    $('hint').textContent='PRESS P TO RESUME';
    $('footlines').textContent='';
    $('ov').classList.remove('hidden');
  }else{
    $('ov').classList.add('hidden');
    state='playing';
  }
  sfxBlip();
}

addEventListener('keydown',e=>{
  const c=e.code;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(c))e.preventDefault();
  if(c==='KeyM'){
    muted=!muted;
    if(master)master.gain.value=muted?0:.22;
    $('snd').textContent=muted?'SOUND OFF · M':'SOUND ON · M';
    return;
  }
  if(c==='KeyP'&&state==='playing'){togglePause();return;}
  if(c==='Enter'||c==='Space'){
    if(state==='title'||state==='over')startGame();
    return;
  }
  const v=KEYS[c];
  if(v&&state==='playing'&&!paused)queueDir(v);
});
addEventListener('pointerdown',()=>{
  ac();
  if(state==='title'||state==='over')startGame();
});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

window.__snk={get state(){return state},get score(){return score},get food(){return food},forceFood:(x,z)=>{food={x,z};},snake:()=>snake.map(c=>[c.x,c.z]),get cam(){const p=camera.position;return[p.x,p.y,p.z]},get camQ(){return camera.quaternion.toArray()}};

freshGame();
showTitle();
setBorder(ZX.yellow);
requestAnimationFrame(frame);
</script>
</body>
</html>
